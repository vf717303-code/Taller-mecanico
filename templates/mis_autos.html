<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Autos</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: white;
        }

        .contenedor {
            max-width: 900px;
            margin: auto;
            padding: 30px;
        }

        h1 {
            color: #ff9800;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #2b2b2b;
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            background: #ff9800;
            color: black;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #444;
        }

        tr:hover {
            background: #333;
        }

        .acciones a {
            margin-right: 10px;
            color: #ff9800;
            text-decoration: none;
            font-weight: bold;
        }

        .acciones a:hover {
            text-decoration: underline;
        }

        .btn {
            background: #ff9800;
            color: black;
            padding: 10px 15px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
        }

        .volver {
            margin-top: 20px;
            display: inline-block;
            color: #ff9800;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="contenedor">

    <h1>Mis Autos</h1>

    <a href="/agregar_auto" class="btn">Agregar auto</a>

    <table>
        <thead>
            <tr>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Placas</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for auto in autos %}
            <tr>
                <td>{{ auto.marca }}</td>
                <td>{{ auto.modelo }}</td>
                <td>{{ auto.placas }}</td>
                <td class="acciones">
                    <a href="/editar_auto/{{ auto.id }}">✏️ Editar</a>
                    <a href="/eliminar_auto/{{ auto.id }}" onclick="return confirm('¿Eliminar este auto?')">🗑️ Eliminar</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="/inicio" class="volver">← Volver</a>

</div>

<script>
(function(){
  const table = document.querySelector('table');
  if (!table) return;
  
  let tbody = table.querySelector('tbody');
  if (!tbody) {
    tbody = document.createElement('tbody');
    const thead = table.querySelector('thead');
    if (thead) {
      thead.parentNode.insertBefore(tbody, thead.nextSibling);
    } else {
      table.appendChild(tbody);
    }
  }
  
  let lastUpdate = 0;
  async function refresh(){
    try {
      const now = Date.now();
      if (now - lastUpdate < 3000) return;
      lastUpdate = now;
      
      const r = await fetch('/api/mis_autos', { cache:'no-store' });
      const data = await r.json();
      if (!data.ok) return;
      const rows = (data.autos||[]).map(a => `
        <tr>
          <td>${a.marca}</td>
          <td>${a.modelo}</td>
          <td>${a.placas}</td>
          <td class="acciones">
            <a href="/editar_auto/${a.id}">✏️ Editar</a>
            <a href="/eliminar_auto/${a.id}" onclick="return confirm('¿Eliminar este auto?')">🗑️ Eliminar</a>
          </td>
        </tr>`).join('');
      tbody.innerHTML = rows;
    } catch {}
  }
  setInterval(refresh, 3000);
})();
</script>

</body>
</html>
