<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Restablecer Contraseña - Taller</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            background-color: #1e1e1e;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-box {
            background-color: #2b2b2b;
            width: 450px;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
            text-align: center;
        }

        .form-box h1 {
            margin: 0;
            color: #ff9800;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .form-box p {
            color: #ccc;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            outline: none;
        }

        .form-box input::placeholder {
            color: #999;
        }

        .form-box button {
            width: 100%;
            padding: 12px;
            font-size: 17px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            background-color: #ff9800;
            color: black;
            cursor: pointer;
            transition: background 0.3s;
        }

        .form-box button:hover {
            background-color: #e68900;
        }

        .error {
            color: #ff5252;
            margin-bottom: 15px;
            background-color: rgba(255, 82, 82, 0.2);
            padding: 10px;
            border-radius: 5px;
            border-left: 4px solid #ff5252;
        }

        .back-link {
            margin-top: 20px;
        }

        .back-link a {
            color: #ff9800;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .back-link a:hover {
            color: #ffc66d;
        }
    </style>
</head>
<body>
    <div class="form-box">
        <h1>Restablecer Contraseña</h1>
        <p>Ingresa tus datos para verificar tu identidad</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post">
            <input type="text" name="nombre" placeholder="Nombre de usuario" required>
            <input type="text" name="telefono" placeholder="Teléfono registrado" required>
            <input type="email" name="correo" placeholder="Correo electrónico registrado" required>
            <button type="submit">Solicitar Nueva Contraseña</button>
        </form>

        <div class="back-link">
            <a href="/login">← Volver al login</a>
        </div>
    </div>
</body>
</html>
